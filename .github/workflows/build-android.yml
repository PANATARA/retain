name: Android Build & Package

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Print Flutter & Java environment info
        run: |
          flutter --version
          java -version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Tests
        run: flutter test

      - name: Build Android Release APK
        run: |
          flutter build apk --release

      - name: Prepare APK Artifact
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ebbplan-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebbplan-android-apk
          path: build/app/outputs/flutter-apk/ebbplan-release.apk
          retention-days: 14

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/ebbplan-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true
